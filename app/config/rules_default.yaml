version: 1
rules:
- id: comm_email
  type: keyword
  priority: 200
  category: 邮件
  patterns:
  - 邮件
  - email
  - 收件箱
  enabled: true
- id: comm_minutes
  type: keyword
  priority: 200
  category: 会议记录
  patterns:
  - 会议
  - 纪要
  - minutes
  - meeting
  enabled: true
- id: fin_expense
  type: keyword
  priority: 200
  category: 财务/报销
  patterns:
  - 报销
  - 费用
  - expense
  enabled: true
- id: fin_invoice
  type: keyword
  priority: 200
  category: 财务/发票
  patterns:
  - 发票
  - invoice
  - 税票
  enabled: true
- id: fin_statement
  type: keyword
  priority: 200
  category: 财务/对账单
  patterns:
  - 对账单
  - 流水
  - statement
  enabled: true
- id: hr_resume
  type: keyword
  priority: 200
  category: 简历
  patterns:
  - 简历
  - resume
  - cv
  enabled: true
- id: id_docs
  type: keyword
  priority: 200
  category: 证件资料
  patterns:
  - 身份证
  - 护照
  - 户口
  - 营业执照
  enabled: true
- id: legal_contract
  type: keyword
  priority: 200
  category: 合同协议
  patterns:
  - 合同
  - 协议
  - contract
  - agreement
  - nda
  enabled: true
- id: legal_docs
  type: keyword
  priority: 200
  category: 法律文书
  patterns:
  - 法律
  - 判决
  - 律师函
  - 诉状
  enabled: true
- id: pers_note
  type: keyword
  priority: 200
  category: 笔记
  patterns:
  - 笔记
  - 备忘
  - note
  enabled: true
- id: shot_screenshot
  type: regex
  priority: 200
  category: 截图
  patterns:
  - ^(screenshot|屏幕截图|截图|image_?\d+)
  enabled: true
- id: archive
  type: extension
  priority: 100
  category: 压缩包
  patterns:
  - .zip
  - .rar
  - .7z
  - .tar
  - .gz
  enabled: true
- id: code
  type: extension
  priority: 100
  category: 代码
  patterns:
  - .py
  - .js
  - .ts
  - .java
  - .c
  - .cpp
  - .go
  - .rs
  - .html
  - .css
  - .json
  - .xml
  - .yaml
  - .sql
  enabled: true
- id: design
  type: extension
  priority: 100
  category: 设计
  patterns:
  - .dwg
  - .dxf
  - .ai
  - .fig
  - .sketch
  - .xd
  enabled: true
- id: doc_pdf
  type: extension
  priority: 100
  category: 文档/PDF
  patterns:
  - .pdf
  enabled: true
- id: doc_sheet
  type: extension
  priority: 100
  category: 文档/表格
  patterns:
  - .xls
  - .xlsx
  - .csv
  - .ods
  enabled: true
- id: doc_slide
  type: extension
  priority: 100
  category: 文档/演示
  patterns:
  - .ppt
  - .pptx
  - .odp
  - .key
  enabled: true
- id: doc_text
  type: extension
  priority: 100
  category: 文档/文本
  patterns:
  - .txt
  - .md
  - .log
  enabled: true
- id: doc_word
  type: extension
  priority: 100
  category: 文档/Word
  patterns:
  - .doc
  - .docx
  - .rtf
  - .odt
  enabled: true
- id: ebook
  type: extension
  priority: 100
  category: 电子书
  patterns:
  - .epub
  - .mobi
  - .azw3
  - .djvu
  enabled: true
- id: font
  type: extension
  priority: 100
  category: 字体
  patterns:
  - .ttf
  - .otf
  - .woff
  - .woff2
  enabled: true
- id: image
  type: extension
  priority: 100
  category: 图片
  patterns:
  - .jpg
  - .jpeg
  - .png
  - .gif
  - .bmp
  - .webp
  - .heic
  - .svg
  - .psd
  enabled: true
- id: installer
  type: extension
  priority: 100
  category: 安装程序
  patterns:
  - .exe
  - .msi
  - .apk
  enabled: true
- id: iso
  type: extension
  priority: 100
  category: 镜像
  patterns:
  - .iso
  - .img
  - .dmg
  enabled: true
- id: media
  type: extension
  priority: 100
  category: 音视频
  patterns:
  - .mp3
  - .wav
  - .flac
  - .mp4
  - .mkv
  - .avi
  - .mov
  enabled: true
